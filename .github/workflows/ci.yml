name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: 验证（Node ${{ matrix.node }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（tsc --noEmit）
        run: pnpm typecheck

      - name: 构建（tsc → lib/）
        run: pnpm build

      - name: 测试（全部冒烟套件）
        run: pnpm test
