# DeepSeek Companion — bundle patch layer
# 当 profile 的 dsh.profile.bundles 列出本包时，该层被应用。
# 每个功能模块在此独立成行：注释掉某行（或加 disabled: true）即可整体停用它。

- insert:
    - id: companion
      name: dsh-companion
      config:
        # 四个功能模块可独立启停，互不影响
        enableExport: true
        enableHandoff: true
        enableCost: true
        enableSearch: true
        # DeepSeek 官方 API（manifest.json 已全量放行各厂商与中转网关域名）
        apiBaseUrl: 'https://api.deepseek.com'
        apiTimeoutMs: 60000
        # 动态计价引擎：完整列出全部键，用户层覆盖时照抄即得整行、不会漏键
        pricingTimeoutMs: 10000
        pricingRefreshIntervalMin: 60
